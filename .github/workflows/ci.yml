name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy contracts/ data/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Detect secrets
        run: uv run detect-secrets scan --baseline .secrets.baseline

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ngo
          POSTGRES_PASSWORD: ngo_local
          POSTGRES_DB: ngo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Init database schemas
        run: |
          PGPASSWORD=ngo_local psql -h localhost -U ngo -d ngo -f dev/init-scripts/01_init.sql
          PGPASSWORD=ngo_local psql -h localhost -U ngo -d ngo -f dev/init-scripts/02_quarantine.sql

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short
        env:
          DATABASE_URL: postgresql://ngo:ngo_local@localhost:5432/ngo

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ngo
          POSTGRES_PASSWORD: ngo_local
          POSTGRES_DB: ngo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Init database schemas
        run: |
          PGPASSWORD=ngo_local psql -h localhost -U ngo -d ngo -f dev/init-scripts/01_init.sql
          PGPASSWORD=ngo_local psql -h localhost -U ngo -d ngo -f dev/init-scripts/02_quarantine.sql

      - name: SQLFluff lint
        run: uv run sqlfluff lint data/dbt/models/ --dialect postgres || true

      - name: dbt deps
        working-directory: data/dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: data/dbt
        run: uv run dbt build --target ci
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: ngo
          POSTGRES_PASSWORD: ngo_local
          POSTGRES_DB: ngo

  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate contracts
        run: |
          uv run python -c "
          from contracts.schemas.petition_events import PetitionEvent, UserSignatureEvent, get_pii_fields

          # Verify schemas load
          print('✅ PetitionEvent schema valid')
          print('✅ UserSignatureEvent schema valid')

          # Verify PII tagging
          pii_fields = get_pii_fields(UserSignatureEvent)
          assert 'user_email' in pii_fields, 'user_email should be PII'
          assert 'user_id' in pii_fields, 'user_id should be PII'
          print(f'✅ PII fields tagged: {pii_fields}')
          "
