apiVersion: 1

datasources:
  # PostgreSQL - Petitions Database
  - name: PostgreSQL-Petitions
    type: postgres
    access: proxy
    url: postgres:5432
    database: petitions
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false

  # Prometheus - Infrastructure Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
