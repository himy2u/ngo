name: 'ngo_platform'
version: '1.0.0'

profile: 'ngo_platform'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ngo_platform:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

# Semantic Layer Configuration
semantic-models:
  - enabled: true

metrics:
  - enabled: true
